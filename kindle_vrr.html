<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poststadion VRR</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      line-height: 1.25;
    }

    body {
      padding: 10px 42px 10px 10px;
    }

    #contentWrap {
      width: 100%;
    }

    body.rotate-left,
    body.rotate-right {
      overflow-x: hidden;
      padding: 0;
    }

    body.rotate-left #contentWrap,
    body.rotate-right #contentWrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      min-height: 100vw;
    }

    body.rotate-left .page,
    body.rotate-right .page {
      margin: 0;
      padding: 10px 42px 72px 10px;
      box-sizing: border-box;
    }

    body.rotate-left #contentWrap {
      -webkit-transform: translateY(100vw) rotate(-90deg);
      -webkit-transform-origin: top left;
      transform: translateY(100vw) rotate(-90deg);
      transform-origin: top left;
    }

    body.rotate-right #contentWrap {
      -webkit-transform: translateX(100vw) rotate(90deg);
      -webkit-transform-origin: top left;
      transform: translateX(100vw) rotate(90deg);
      transform-origin: top left;
    }

    .page {
      box-sizing: border-box;
      width: 100%;
      max-width: 790px;
      margin: 0 auto;
    }

    .board {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .row {
      border-bottom: 2px solid #000;
      padding: 10px 0;
      overflow: hidden;
    }

    .line {
      float: left;
      width: 96px;
      height: 52px;
      border: 2px solid #000;
      text-align: center;
      font-size: 30px;
      line-height: 52px;
      font-weight: bold;
      margin-right: 12px;
      overflow: hidden;
      box-sizing: border-box;
    }

    .line-active {
      background: #000;
      color: #fff;
    }

    .time {
      float: right;
      width: 145px;
      text-align: right;
      font-size: 34px;
      line-height: 52px;
      font-weight: bold;
      white-space: nowrap;
      margin-left: 8px;
    }

    .dest {
      overflow: hidden;
      font-size: 24px;
      line-height: 52px;
      font-weight: bold;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .status {
      font-size: 14px;
      font-style: italic;
      text-align: right;
      min-height: 18px;
      margin-bottom: 4px;
    }

    .empty {
      border: 2px solid #000;
      padding: 14px;
      font-weight: bold;
    }

    .rotate-btn {
      width: 56px;
      min-width: 56px;
      height: 48px;
      min-height: 48px;
      padding: 0;
      line-height: 44px;
      text-align: center;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      font-size: 20px;
      font-weight: bold;
    }

    .rotate-row {
      border-top: 2px solid #000;
      margin-top: 12px;
      padding-top: 10px;
      overflow: hidden;
    }

    .rotate-right-btn {
      float: right;
    }

    body.rotate-left .rotate-left-btn,
    body.rotate-right .rotate-right-btn {
      background: #000;
      color: #fff;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px 34px 8px 8px;
        font-size: 18px;
      }

      body.rotate-left,
      body.rotate-right {
        padding: 0;
      }

      body.rotate-left .page,
      body.rotate-right .page {
        padding: 8px 34px 68px 8px;
      }

      .line {
        width: 82px;
        height: 48px;
        font-size: 27px;
        line-height: 48px;
        margin-right: 8px;
      }

      .time {
        width: 120px;
        font-size: 30px;
        line-height: 48px;
      }

      .dest {
        font-size: 21px;
        line-height: 48px;
      }
    }
  </style>
</head>
<body>
  <div id="contentWrap">
    <div class="page">
      <div id="status" class="status">...</div>
      <ul id="board" class="board"></ul>
      <div id="message" class="empty" style="display:none">Keine Daten</div>
      <div class="rotate-row">
        <button id="rotateLeftButton" class="rotate-btn rotate-left-btn" type="button">L</button>
        <button id="rotateRightButton" class="rotate-btn rotate-right-btn" type="button">R</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ROTATION_STORAGE_KEY = 'bvg_kindle_vrr_rotation';
      var DEFAULT_REFRESH_MS = 60000;
      var PEAK_REFRESH_MS = 20000;
      var boardEl = document.getElementById('board');
      var statusEl = document.getElementById('status');
      var messageEl = document.getElementById('message');
      var contentWrap = document.getElementById('contentWrap');
      var pageEl = contentWrap.getElementsByTagName('div')[0];
      var rotateLeftButton = document.getElementById('rotateLeftButton');
      var rotateRightButton = document.getElementById('rotateRightButton');
      var timer = null;
      var activeLineFilter = '';
      var departures = [];

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function setStatus(text) {
        statusEl.innerHTML = escapeHtml(text || '');
      }

      function showMessage(text) {
        messageEl.style.display = text ? 'block' : 'none';
        messageEl.innerHTML = escapeHtml(text || '');
      }

      function getViewportSize() {
        var doc = document.documentElement || {};
        var body = document.body || {};
        var w = doc.clientWidth || body.clientWidth || window.innerWidth || 600;
        var h = doc.clientHeight || body.clientHeight || window.innerHeight || 800;
        return {
          width: w,
          height: h
        };
      }

      function setRotation(mode) {
        var cls = document.body.className || '';
        var viewport = getViewportSize();
        var viewportW = viewport.width;
        var viewportH = viewport.height;
        var fixedWidth = viewportW < viewportH ? viewportW : viewportH;
        cls = cls.replace(/\brotate-left\b/g, '').replace(/\brotate-right\b/g, '').replace(/\s+/g, ' ');
        mode = mode === 'left' || mode === 'right' ? mode : '';
        if (mode) cls += ' rotate-' + mode;
        document.body.className = cls.replace(/^\s+|\s+$/g, '');
        contentWrap.style.width = '';
        contentWrap.style.minHeight = '';
        contentWrap.style.webkitTransform = '';
        contentWrap.style.transform = '';
        pageEl.style.width = '';
        document.body.style.minHeight = '';
        document.body.style.width = '';
        if (mode) {
          contentWrap.style.width = fixedWidth + 'px';
          contentWrap.style.minHeight = fixedWidth + 'px';
          pageEl.style.width = fixedWidth + 'px';
          if (mode === 'left') {
            contentWrap.style.webkitTransform = 'translateY(' + fixedWidth + 'px) rotate(-90deg)';
            contentWrap.style.transform = 'translateY(' + fixedWidth + 'px) rotate(-90deg)';
          } else {
            contentWrap.style.webkitTransform = 'translateX(' + fixedWidth + 'px) rotate(90deg)';
            contentWrap.style.transform = 'translateX(' + fixedWidth + 'px) rotate(90deg)';
          }
          setTimeout(function () {
            var contentHeight = contentWrap.scrollHeight || fixedWidth;
            document.body.style.width = fixedWidth + 'px';
            document.body.style.minHeight = Math.max(fixedWidth, contentHeight) + 'px';
          }, 0);
        }
        try {
          window.localStorage.setItem(ROTATION_STORAGE_KEY, mode);
        } catch (e) {
          return;
        }
      }

      function loadRotation() {
        var mode = '';
        try {
          mode = window.localStorage.getItem(ROTATION_STORAGE_KEY) || '';
        } catch (e) {
          mode = '';
        }
        setRotation(mode);
      }

      function refreshRotationLayout() {
        if (document.body.className.indexOf('rotate-left') >= 0) {
          setRotation('left');
        } else if (document.body.className.indexOf('rotate-right') >= 0) {
          setRotation('right');
        }
      }

      function render(items) {
        var html = '';
        var i;
        var item;
        var line;

        if (!items || !items.length) {
          boardEl.innerHTML = '';
          showMessage('Keine Daten');
          return;
        }

        showMessage('');
        for (i = 0; i < items.length; i += 1) {
          item = items[i] || {};
          line = item.line || '';
          if (activeLineFilter && line !== activeLineFilter) continue;
          html += '<li class="row">' +
            '<div class="line' + (activeLineFilter === line ? ' line-active' : '') + '" data-line="' + escapeHtml(line) + '">' + escapeHtml(line) + '</div>' +
            '<div class="time">' + escapeHtml(item.time || '') + '</div>' +
            '<div class="dest">' + escapeHtml(item.destination || '') + '</div>' +
            '</li>';
        }
        boardEl.innerHTML = html;
        if (!html) showMessage('Keine Fahrten fuer diese Linie');
        refreshRotationLayout();
      }

      function requestBoard() {
        var xhr = new XMLHttpRequest();
        if (window.location && window.location.protocol === 'file:') {
          setStatus('err');
          showMessage('Bitte ueber http://Server:3000/kindle_vrr oeffnen');
          return;
        }
        xhr.open('GET', '/api/vrrf/poststadion?results=8', true);
        xhr.onreadystatechange = function () {
          var data;
          if (xhr.readyState !== 4) return;
          if (xhr.status < 200 || xhr.status >= 300) {
            setStatus('err');
            if (!boardEl.innerHTML) showMessage('Keine Verbindung');
            return;
          }
          try {
            data = JSON.parse(xhr.responseText);
          } catch (e) {
            setStatus('err');
            if (!boardEl.innerHTML) showMessage('Ungueltige Antwort');
            return;
          }
          departures = data.departures || [];
          render(departures);
          setStatus('live');
        };
        xhr.send(null);
      }

      function getRefreshDelay() {
        var now = new Date();
        var day = now.getDay();
        var hour = now.getHours();
        if (day >= 1 && day <= 5 && hour >= 7 && hour < 9) return PEAK_REFRESH_MS;
        return DEFAULT_REFRESH_MS;
      }

      function schedule() {
        if (timer) window.clearTimeout(timer);
        timer = window.setTimeout(function () {
          requestBoard();
          schedule();
        }, getRefreshDelay());
      }

      boardEl.onclick = function (event) {
        var target = event.target || event.srcElement;
        var lineName;
        while (target && target !== boardEl && (!target.className || String(target.className).indexOf('line') === -1)) {
          target = target.parentNode;
        }
        if (!target || target === boardEl) return;
        lineName = target.getAttribute('data-line') || '';
        if (!lineName) return;
        activeLineFilter = activeLineFilter === lineName ? '' : lineName;
        render(departures);
      };

      rotateLeftButton.onclick = function () {
        setRotation(document.body.className.indexOf('rotate-left') >= 0 ? '' : 'left');
      };

      rotateRightButton.onclick = function () {
        setRotation(document.body.className.indexOf('rotate-right') >= 0 ? '' : 'right');
      };

      window.onresize = refreshRotationLayout;
      loadRotation();
      requestBoard();
      schedule();

      window.onunload = function () {
        if (timer) window.clearTimeout(timer);
        window.onresize = null;
      };
    }());
  </script>
</body>
</html>
