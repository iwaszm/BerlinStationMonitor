<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berlin Abfahrten Kindle</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      line-height: 1.35;
    }

    body {
      padding: 12px 42px 72px 12px;
    }

    #contentWrap {
      width: 100%;
    }

    body.rotate-left,
    body.rotate-right {
      overflow-x: hidden;
    }

    body.rotate-left #contentWrap,
    body.rotate-right #contentWrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vh;
      min-height: 100vw;
    }

    body.rotate-left .page,
    body.rotate-right .page {
      max-width: none;
      margin: 0;
      padding-right: 42px;
      box-sizing: border-box;
    }

    body.rotate-left #contentWrap {
      -webkit-transform: translateY(100vw) rotate(-90deg);
      -webkit-transform-origin: top left;
      transform: translateY(100vw) rotate(-90deg);
      transform-origin: top left;
    }

    body.rotate-right #contentWrap {
      -webkit-transform: translateX(100vh) rotate(90deg);
      -webkit-transform-origin: top left;
      transform: translateX(100vh) rotate(90deg);
      transform-origin: top left;
    }

    .page {
      box-sizing: border-box;
      max-width: 790px;
      margin: 0 auto;
    }

    .search {
      border-bottom: 2px solid #000;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input, button {
      font: inherit;
      box-sizing: border-box;
    }

    input {
      width: 100%;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      padding: 10px 62px 10px 10px;
      border-radius: 0;
    }

    button {
      border: 2px solid #000;
      background: #fff;
      color: #000;
      padding: 10px 14px;
      min-height: 48px;
      min-width: 96px;
      border-radius: 0;
      font-weight: bold;
    }

    button:active {
      background: #000;
      color: #fff;
    }

    .search-row {
      display: table;
      width: 100%;
      table-layout: fixed;
    }

    .search-field {
      display: table-cell;
      width: 100%;
      vertical-align: top;
      padding-right: 8px;
      position: relative;
    }

    .status-cell {
      position: absolute;
      top: 50%;
      right: 18px;
      margin-top: -10px;
      height: 20px;
      line-height: 20px;
      white-space: nowrap;
      text-align: right;
      font-size: 14px;
      font-style: italic;
      color: #333;
      pointer-events: none;
    }

    .button-row {
      display: table-cell;
      width: 114px;
      white-space: nowrap;
      vertical-align: top;
      text-align: right;
    }

    .button-row button {
      width: 108px;
      min-width: 108px;
      margin: 0 0 0 6px;
      padding-left: 6px;
      padding-right: 6px;
      text-align: center;
    }

    .muted {
      color: #333;
      font-weight: normal;
    }

    .error {
      border: 3px solid #000;
      padding: 10px;
      margin: 10px 0;
      font-weight: bold;
    }

    .results {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      border-top: 2px solid #000;
    }

    .results li {
      border-bottom: 2px solid #000;
    }

    .result-button {
      display: block;
      width: 100%;
      min-height: 54px;
      border: 0;
      text-align: left;
      padding: 12px 4px;
      font-weight: bold;
    }

    .departures {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .departure {
      border-bottom: 2px solid #000;
      padding: 10px 0;
      overflow: hidden;
    }

    .line {
      float: left;
      width: 96px;
      height: 52px;
      border: 2px solid #000;
      text-align: center;
      font-size: 28px;
      line-height: 52px;
      font-weight: bold;
      margin-right: 12px;
      overflow: hidden;
      white-space: nowrap;
    }

    .line-active {
      background: #000;
      color: #fff;
    }

    .dep-main {
      overflow: hidden;
      padding-right: 8px;
    }

    .direction {
      font-size: 21px;
      font-weight: bold;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .dep-meta {
      margin-top: 4px;
      font-size: 18px;
    }

    .dep-time {
      float: right;
      width: 220px;
      text-align: right;
      min-height: 48px;
      margin-left: 8px;
      white-space: nowrap;
    }

    .dep-delay {
      display: inline-block;
      min-width: 50px;
      font-size: 17px;
      font-style: italic;
      font-weight: normal;
      line-height: 1;
      vertical-align: baseline;
      margin-right: 8px;
    }

    .dep-clock {
      display: inline-block;
      font-size: 38px;
      line-height: 1.05;
      font-weight: bold;
      vertical-align: baseline;
    }

    .cancelled-time {
      text-decoration: line-through;
    }

    .cancelled-line,
    .cancelled-direction {
      text-decoration: line-through;
    }

    .cancel-label {
      display: inline-block;
      min-width: 72px;
      font-size: 17px;
      font-style: italic;
      font-weight: normal;
      line-height: 1;
      vertical-align: baseline;
      margin-right: 8px;
    }

    .delay {
      font-weight: bold;
    }

    .empty {
      border: 2px solid #000;
      padding: 14px;
      margin-top: 12px;
      font-weight: bold;
    }

    .rotate-btn {
      width: 56px;
      min-width: 56px;
      height: 48px;
      min-height: 48px;
      padding: 0;
      line-height: 44px;
      text-align: center;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      font-size: 20px;
      font-weight: bold;
    }

    .rotate-row {
      border-top: 2px solid #000;
      margin-top: 12px;
      padding-top: 10px;
      overflow: hidden;
    }

    .rotate-right-btn {
      float: right;
    }

    body.rotate-left .rotate-left-btn,
    body.rotate-right .rotate-right-btn {
      background: #000;
      color: #fff;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px 34px 68px 8px;
        font-size: 17px;
      }

      .line {
        width: 82px;
        height: 48px;
        font-size: 25px;
        line-height: 48px;
        margin-right: 8px;
      }

      .button-row {
        width: 98px;
      }

      .status-cell {
        right: 14px;
        font-size: 13px;
      }

      input {
        padding-right: 54px;
      }

      button {
        min-width: 0;
        padding-left: 8px;
        padding-right: 8px;
      }

      .button-row button {
        width: 92px;
        min-width: 92px;
        padding-left: 4px;
        padding-right: 4px;
      }

      .direction {
        font-size: 19px;
      }

      .dep-meta {
        font-size: 16px;
      }

      .dep-time {
        width: 180px;
      }

      .dep-clock {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <div id="contentWrap">
    <div class="page">
      <div class="search">
        <div class="search-row">
          <div class="search-field">
            <input id="stationQuery" type="text" autocomplete="off" placeholder="Haltestelle">
            <div id="statusText" class="status-cell"></div>
          </div>
          <div class="button-row">
            <button id="searchButton" type="button">Suchen</button>
          </div>
        </div>
        <ul id="results" class="results"></ul>
      </div>

      <div id="message" class="empty">Keine Haltestelle ausgewaehlt.</div>
      <ul id="departures" class="departures"></ul>
      <div class="rotate-row">
        <button id="rotateLeftButton" class="rotate-btn rotate-left-btn" type="button">L</button>
        <button id="rotateRightButton" class="rotate-btn rotate-right-btn" type="button">R</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var API_BASE = '/api';
      var STORAGE_KEY = 'bvg_kindle_station';
      var DEPARTURES_CACHE_PREFIX = 'bvg_kindle_departures_';
      var ROTATION_STORAGE_KEY = 'bvg_kindle_rotation';
      var REFRESH_MS = 60000;
      var selectedStation = null;
      var activeLineFilter = '';
      var departures = [];
      var departuresLastUpdated = null;
      var departuresIsStale = false;
      var lastErrorText = '';
      var statusState = '';
      var failureCount = 0;
      var refreshTimer = null;

      var stationQuery = document.getElementById('stationQuery');
      var searchButton = document.getElementById('searchButton');
      var statusText = document.getElementById('statusText');
      var resultsEl = document.getElementById('results');
      var messageEl = document.getElementById('message');
      var departuresEl = document.getElementById('departures');
      var contentWrap = document.getElementById('contentWrap');
      var rotateLeftButton = document.getElementById('rotateLeftButton');
      var rotateRightButton = document.getElementById('rotateRightButton');

      function pad(num) {
        return num < 10 ? '0' + num : String(num);
      }

      function cleanName(name) {
        if (!name) return '';
        return String(name)
          .replace(/^Berlin\s+/i, '')
          .replace(/\s+\(Berlin\)$/i, '');
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#96;');
      }

      function encodeParams(params) {
        var parts = [];
        var key;
        for (key in params) {
          if (params.hasOwnProperty(key)) {
            parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(params[key]));
          }
        }
        return parts.join('&');
      }

      function requestJson(path, params, callback) {
        var xhr = new XMLHttpRequest();
        var url = API_BASE + path;
        var query = params ? encodeParams(params) : '';
        if (query) url += '?' + query;

        xhr.open('GET', url, true);
        xhr.onreadystatechange = function () {
          var data;
          if (xhr.readyState !== 4) return;
          if (xhr.status < 200 || xhr.status >= 300) {
            callback(new Error('HTTP ' + xhr.status), null, {
              status: xhr.status
            });
            return;
          }
          try {
            data = JSON.parse(xhr.responseText);
          } catch (e) {
            callback(new Error('Ungueltige Antwort'), null, {
              status: xhr.status
            });
            return;
          }
          callback(null, data, {
            status: xhr.status,
            cacheState: xhr.getResponseHeader('X-Proxy-Cache') || '',
            fetchedAt: xhr.getResponseHeader('X-Proxy-Fetched-At') || ''
          });
        };
        xhr.send(null);
      }

      function setStatus(text, isError) {
        if (isError) setMessage(text, true);
      }

      function updateStatusText(state) {
        statusState = state || '';
        if (statusState === 'loading') {
          statusText.innerHTML = '...';
        } else if (statusState === 'stale') {
          statusText.innerHTML = 'alt';
        } else if (statusState === 'slow') {
          statusText.innerHTML = 'lang';
        } else if (statusState === 'error') {
          statusText.innerHTML = 'err';
        } else {
          statusText.innerHTML = 'live';
        }
      }

      function setMessage(text, isError) {
        messageEl.style.display = text ? 'block' : 'none';
        messageEl.className = isError ? 'empty error' : 'empty';
        messageEl.innerHTML = escapeHtml(text || '');
      }

      function clearResults() {
        resultsEl.innerHTML = '';
      }

      function setRotation(mode) {
        var cls = document.body.className || '';
        var viewportW = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth || 600;
        var viewportH = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight || 800;
        cls = cls.replace(/\brotate-left\b/g, '').replace(/\brotate-right\b/g, '').replace(/\s+/g, ' ');
        mode = mode === 'left' || mode === 'right' ? mode : '';
        if (mode) cls += ' rotate-' + mode;
        document.body.className = cls.replace(/^\s+|\s+$/g, '');
        contentWrap.style.width = '';
        contentWrap.style.minHeight = '';
        contentWrap.style.webkitTransform = '';
        contentWrap.style.transform = '';
        document.body.style.minHeight = '';
        if (mode) {
          contentWrap.style.width = viewportH + 'px';
          contentWrap.style.minHeight = viewportW + 'px';
          if (mode === 'left') {
            contentWrap.style.webkitTransform = 'translateY(' + viewportW + 'px) rotate(-90deg)';
            contentWrap.style.transform = 'translateY(' + viewportW + 'px) rotate(-90deg)';
          } else {
            contentWrap.style.webkitTransform = 'translateX(' + viewportH + 'px) rotate(90deg)';
            contentWrap.style.transform = 'translateX(' + viewportH + 'px) rotate(90deg)';
          }
          setTimeout(function () {
            var contentHeight = contentWrap.scrollHeight || viewportW;
            document.body.style.minHeight = Math.max(viewportH, contentHeight) + 'px';
          }, 0);
        }
        try {
          window.localStorage.setItem(ROTATION_STORAGE_KEY, mode);
        } catch (e) {
          return;
        }
      }

      function loadRotation() {
        var mode = '';
        try {
          mode = window.localStorage.getItem(ROTATION_STORAGE_KEY) || '';
        } catch (e) {
          mode = '';
        }
        setRotation(mode);
      }

      function refreshRotationLayout() {
        if (document.body.className.indexOf('rotate-left') >= 0) {
          setRotation('left');
        } else if (document.body.className.indexOf('rotate-right') >= 0) {
          setRotation('right');
        }
      }

      function saveStation(station) {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
            id: station.id,
            name: station.name
          }));
        } catch (e) {
          return;
        }
      }

      function loadSavedStation() {
        var raw;
        var parsed;
        try {
          raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          parsed = JSON.parse(raw);
          if (parsed && parsed.id && parsed.name) return parsed;
        } catch (e) {
          return null;
        }
        return null;
      }

      function clearSavedStation() {
        try {
          window.localStorage.removeItem(STORAGE_KEY);
        } catch (e) {
          return;
        }
      }

      function getDepartureCacheKey() {
        return selectedStation ? DEPARTURES_CACHE_PREFIX + selectedStation.id : '';
      }

      function saveDeparturesCache() {
        var key = getDepartureCacheKey();
        if (!key) return;
        try {
          window.localStorage.setItem(key, JSON.stringify({
            fetchedAt: departuresLastUpdated ? departuresLastUpdated.toISOString() : new Date().toISOString(),
            departures: departures || []
          }));
        } catch (e) {
          return;
        }
      }

      function loadDeparturesCache() {
        var key = getDepartureCacheKey();
        var raw;
        var parsed;
        if (!key) return false;
        try {
          raw = window.localStorage.getItem(key);
          if (!raw) return false;
          parsed = JSON.parse(raw);
          if (!parsed || !parsed.departures || typeof parsed.departures.length !== 'number') return false;
          departures = parsed.departures;
          departuresLastUpdated = parsed.fetchedAt ? new Date(parsed.fetchedAt) : null;
          departuresIsStale = true;
          return true;
        } catch (e) {
          return false;
        }
      }

      function classifyError(err, meta) {
        var status = meta && meta.status;
        if (status === 429) return 'Zu viele Anfragen. Aktualisierung verlangsamt.';
        if (status === 400 || status === 404) return 'Haltestelle konnte nicht geladen werden.';
        if (status >= 500) return 'Datenquelle nicht erreichbar.';
        return err && err.message ? err.message : 'Keine Verbindung.';
      }

      function getRefreshDelay() {
        if (failureCount >= 3) return 120000;
        if (failureCount >= 1) return 60000;
        return REFRESH_MS;
      }

      function selectStation(station) {
        selectedStation = {
          id: station.id,
          name: station.name
        };
        departures = [];
        departuresLastUpdated = null;
        departuresIsStale = false;
        lastErrorText = '';
        activeLineFilter = '';
        stationQuery.value = cleanName(station.name);
        clearResults();
        saveStation(selectedStation);
        fetchDepartures(false);
        startRefreshLoop();
      }

      function renderSearchResults(items) {
        var html = '';
        var i;
        var station;

        clearResults();
        if (!items || items.length === 0) {
          setMessage('Keine Haltestellen gefunden.');
          return;
        }

        for (i = 0; i < items.length; i += 1) {
          station = items[i];
          if (!station || !station.id || station.type !== 'stop') continue;
          html += '<li><button type="button" class="result-button" data-index="' + i + '">' +
            escapeHtml(cleanName(station.name)) + '</button></li>';
        }

        resultsEl.innerHTML = html;
        resultsEl._stations = items;
        setMessage('');
      }

      function searchStations() {
        var query = stationQuery.value.replace(/^\s+|\s+$/g, '');
        if (!query) {
          setStatus('Bitte Suchbegriff eingeben.', true);
          return;
        }

        activeLineFilter = '';
        setMessage('');
        clearResults();
        requestJson('/locations', {
          query: query,
          results: 6,
          stops: 'true'
        }, function (err, data) {
          var stops = [];
          var i;
          if (err) {
            setStatus('Suche fehlgeschlagen. Verbindung pruefen.', true);
            return;
          }
          if (data && data.length) {
            for (i = 0; i < data.length; i += 1) {
              if (data[i] && data[i].type === 'stop') stops.push(data[i]);
            }
          }
          renderSearchResults(stops);
        });
      }

      function getTimeValue(dep) {
        return dep && (dep.when || dep.plannedWhen) ? new Date(dep.when || dep.plannedWhen) : null;
      }

      function getTimeText(dep) {
        var iso = dep && (dep.when || dep.plannedWhen) ? String(dep.when || dep.plannedWhen) : '';
        var match = iso.match(/T(\d{2}):(\d{2})/);
        if (match) return match[1] + ':' + match[2];
        return '--:--';
      }

      function formatDelay(dep) {
        var min;
        if (!dep || dep.delay == null || dep.cancelled) return '';
        min = Math.round(dep.delay / 60);
        if (min === 0) return '';
        if (min > 0) return '(+' + min + ')';
        return '(' + min + ')';
      }

      function isRail(product) {
        return product === 'suburban' ||
          product === 'subway' ||
          product === 'regional' ||
          product === 'regionalExp' ||
          product === 'express' ||
          product === 'national' ||
          product === 'nationalExpress';
      }

      function sortDepartures(a, b) {
        var at = getTimeValue(a);
        var bt = getTimeValue(b);
        var av = at && !isNaN(at.getTime()) ? at.getTime() : 0;
        var bv = bt && !isNaN(bt.getTime()) ? bt.getTime() : 0;
        return av - bv;
      }

      function renderDepartures() {
        var html = '';
        var i;
        var dep;
        var time;
        var lineName;
        var direction;
        var delay;
        var platform;
        var meta;

        departuresEl.innerHTML = '';
        if (!selectedStation) {
          setMessage('');
          return;
        }
        if (!departures || departures.length === 0) {
          setMessage(lastErrorText ? 'Keine Daten' : 'Keine Abfahrten in den naechsten 60 Minuten.', !!lastErrorText);
          return;
        }

        setMessage('');
        departures.sort(sortDepartures);

        for (i = 0; i < departures.length; i += 1) {
          dep = departures[i];
          if (!dep || !dep.line) continue;
          time = getTimeValue(dep);
          if (time && time.getTime() < new Date().getTime() - 30000) continue;

          lineName = dep.line.name || '?';
          if (activeLineFilter && lineName !== activeLineFilter) continue;
          direction = cleanName(dep.direction || '');
          delay = formatDelay(dep);
          platform = '';
          if (isRail(dep.line.product) && (dep.platform || dep.plannedPlatform)) {
            platform = 'Gl. ' + (dep.platform || dep.plannedPlatform);
          }

          meta = '';
          if (platform) meta = escapeHtml(platform);

          html += '<li class="departure">' +
            '<div class="line' + (activeLineFilter === lineName ? ' line-active' : '') + (dep.cancelled ? ' cancelled-line' : '') + '" data-line="' + escapeAttr(lineName) + '">' + escapeHtml(lineName) + '</div>' +
            '<div class="dep-time">' +
            (dep.cancelled ? '<div class="cancel-label">faellt aus</div>' : '<div class="dep-delay">' + escapeHtml(delay) + '</div>') +
            '<div class="dep-clock' + (dep.cancelled ? ' cancelled-time' : '') + '">' + escapeHtml(getTimeText(dep)) + '</div>' +
            '</div>' +
            '<div class="dep-main">' +
            '<div class="direction' + (dep.cancelled ? ' cancelled-direction' : '') + '">' + escapeHtml(direction) + '</div>' +
            '<div class="dep-meta">' + meta + '</div>' +
            '</div>' +
            '</li>';
        }

        departuresEl.innerHTML = html;
        if (!html) setMessage('Keine aktuellen Abfahrten in den naechsten 60 Minuten.');
        refreshRotationLayout();
      }

      function fetchDepartures(silent) {
        if (!selectedStation) {
          renderDepartures();
          return;
        }

        updateStatusText('loading');
        if (!silent) {
          if (!departures || departures.length === 0) loadDeparturesCache();
          renderDepartures();
        }

        requestJson('/stops/' + encodeURIComponent(selectedStation.id) + '/departures', {
          duration: 60,
          results: 40
        }, function (err, data, meta) {
          if (err) {
            failureCount += 1;
            lastErrorText = classifyError(err, meta);
            if (!departures || departures.length === 0) loadDeparturesCache();
            departuresIsStale = true;
            updateStatusText(failureCount >= 3 ? 'slow' : 'error');
            renderDepartures();
            return;
          }
          departures = data && data.departures ? data.departures : [];
          departuresIsStale = meta && String(meta.cacheState).toUpperCase() === 'STALE';
          departuresLastUpdated = meta && meta.fetchedAt ? new Date(meta.fetchedAt) : new Date();
          if (!departuresLastUpdated || isNaN(departuresLastUpdated.getTime())) departuresLastUpdated = new Date();
          lastErrorText = '';
          failureCount = 0;
          saveDeparturesCache();
          updateStatusText(departuresIsStale ? 'stale' : '');
          renderDepartures();
        });
      }

      function startRefreshLoop() {
        if (refreshTimer) window.clearTimeout(refreshTimer);
        refreshTimer = window.setTimeout(function () {
          fetchDepartures(true);
          startRefreshLoop();
        }, getRefreshDelay());
      }

      resultsEl.onclick = function (event) {
        var target = event.target || event.srcElement;
        var index;
        while (target && target !== resultsEl && target.getAttribute('data-index') == null) {
          target = target.parentNode;
        }
        if (!target || target === resultsEl) return;
        index = parseInt(target.getAttribute('data-index'), 10);
        if (resultsEl._stations && resultsEl._stations[index]) {
          selectStation(resultsEl._stations[index]);
        }
      };

      departuresEl.onclick = function (event) {
        var target = event.target || event.srcElement;
        var lineName;
        while (target && target !== departuresEl && (!target.className || String(target.className).indexOf('line') === -1)) {
          target = target.parentNode;
        }
        if (!target || target === departuresEl) return;
        lineName = target.getAttribute('data-line') || '';
        if (!lineName) return;
        activeLineFilter = activeLineFilter === lineName ? '' : lineName;
        renderDepartures();
      };

      searchButton.onclick = searchStations;
      rotateLeftButton.onclick = function () {
        setRotation(document.body.className.indexOf('rotate-left') >= 0 ? '' : 'left');
      };
      rotateRightButton.onclick = function () {
        setRotation(document.body.className.indexOf('rotate-right') >= 0 ? '' : 'right');
      };

      stationQuery.onkeydown = function (event) {
        event = event || window.event;
        if (event.keyCode === 13) {
          searchStations();
          return false;
        }
        return true;
      };
      window.onresize = refreshRotationLayout;

      updateStatusText('');
      loadRotation();

      selectedStation = loadSavedStation();
      if (selectedStation) {
        stationQuery.value = cleanName(selectedStation.name);
        fetchDepartures(false);
        startRefreshLoop();
      } else {
        renderDepartures();
      }

      window.onunload = function () {
        if (refreshTimer) window.clearTimeout(refreshTimer);
        window.onresize = null;
      };
    }());
  </script>
</body>
</html>
